# Local development stack: MongoDB + the Express API + floci (local AWS emulator).
#   docker compose up -d --build        -> API on http://localhost:3000, MongoDB on localhost:27017,
#                                          floci (S3 + Secrets Manager) on http://localhost:4566
#   docker compose run --rm test        -> run the automated test suite inside Docker
# API environment, later files win: docker/dev.env (safe defaults) < .env < .env.docker
# (.env.docker is generated from AWS Secrets Manager by scripts/aws/secrets-to-env.sh, see docs/aws.md).
services:
  mongo:
    image: mongo:7
    ports:
      # Set MONGO_HOST_PORT=27018 if a local MongoDB already uses 27017.
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file:
      - path: docker/dev.env
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/vms
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  # floci runs each Lambda function in its own container, so it needs the Docker socket.
  # Local development only: this gives floci control over Docker on this PC.
  floci:
    image: floci/floci:latest
    ports:
      - "127.0.0.1:${FLOCI_HOST_PORT:-4566}:4566"
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_DOCKER_DOCKER_HOST: unix:///var/run/docker.sock
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_DOCKER_NETWORK: vms-net
      # Few warm Lambda containers: the project runs on laptops with 8 GB RAM.
      FLOCI_SERVICES_LAMBDA_WARM_POOL_MAX_TOTAL: "6"

  # Optional web UI for floci: docker compose --profile ui up -d floci-dash -> http://localhost:8080
  # Deliberately NOT given the Docker socket, so the UI cannot control containers on the host.
  floci-dash:
    image: ghcr.io/ofsazib/floci-dash:latest
    profiles: ["ui"]
    environment:
      FLOCI_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "127.0.0.1:${FLOCI_DASH_HOST_PORT:-8080}:3000"
    depends_on:
      - floci

  test:
    build: .
    profiles: ["test"]
    environment:
      NODE_ENV: test
      TEST_MONGODB_URI: mongodb://mongo:27017
    command: ["npm", "test"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  floci-data:

# Fixed network name so floci can attach its Lambda containers to it (they reach floci and mongo by name).
networks:
  default:
    name: vms-net
