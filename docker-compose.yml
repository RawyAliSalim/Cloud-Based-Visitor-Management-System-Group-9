# Local development stack: MongoDB + the Express API.
#   docker compose up -d --build        -> API on http://localhost:3000, MongoDB on localhost:27017
#   docker compose run --rm test        -> run the automated test suite inside Docker
# Values from a local .env file are used when present; nothing here is a real secret.
services:
  mongo:
    image: mongo:7
    ports:
      # Set MONGO_HOST_PORT=27018 if a local MongoDB already uses 27017.
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/vms
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-only-session-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  test:
    build: .
    profiles: ["test"]
    environment:
      NODE_ENV: test
      TEST_MONGODB_URI: mongodb://mongo:27017
    command: ["npm", "test"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
